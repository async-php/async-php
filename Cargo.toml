[package]
name = "async-php"
version = "0.4.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "*"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
futures = "0.3"
httparse = "1.8"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "mysql", "postgres", "macros" ] }
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.19", features = ["full"] }
http-body-util = "0.1.3"
bytes = "1.11.0"
http = "1.4.0"
quinn = "0.11.9"
rustls = { version = "0.23.35", features = ["ring"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.5"
tokio-rustls = "0.26.4"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "time", "local-time"] }
