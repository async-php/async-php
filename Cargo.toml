[package]
name = "async-php"
version = "0.4.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "*"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
futures = "0.3"
httparse = "1.8"
serde_json = "1.0"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "mysql", "postgres", "macros" ] }
# HTTP client - reqwest provides high-level HTTP client with connection pooling
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "gzip", "deflate", "brotli", "rustls-tls", "rustls-tls-native-roots"], default-features = false }
http = "1.4.0"
bytes = "1.11.0"
url = "2.5"
rustls = { version = "0.23.35", features = ["ring"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.10"
webpki-roots = "0.26"
rcgen = "0.14.5"
tokio-rustls = "0.26.4"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "time", "local-time"] }
tokio-util = { version = "0.7", features = ["io", "codec", "compat"] }
tokio-stream = { version = "0.1", features = ["sync"] }
flume = "0.11"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"

[features]
http3 = []

